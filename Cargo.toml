[package]
name = "syncthing-backup-tool"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Scheduled, verified ZIP snapshots with bounded retention for Linux"
repository = "https://github.com/dingyisun0101/syncthing-backup-tool"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process", "param"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs", "chrono"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
